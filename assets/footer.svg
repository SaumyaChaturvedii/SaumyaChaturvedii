<svg width="100%" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wave1 { animation: shift 12s linear infinite reverse; }
    .wave2 { animation: shift 8s linear infinite; }
    @keyframes shift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1000px); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#08040A" />
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Cyberpunk grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Wave paths (inverted for footer) -->
  <g class="wave1">
    <path d="M 0 50 Q 250 100 500 50 T 1000 50 T 1500 50 T 2000 50 L 2000 0 L 0 0 Z" fill="rgba(255,0,127,0.15)" />
  </g>
  <g class="wave2">
    <path d="M 0 20 Q 250 70 500 20 T 1000 20 T 1500 20 T 2000 20 L 2000 0 L 0 0 Z" fill="rgba(0,229,255,0.15)" />
  </g>

  <!-- Accent Lines -->
  <path d="M 0 120 L 20 140 L 150 140 L 160 130 L 200 130" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.6"/>
  <path d="M 1000 10 L 980 30 L 850 30 L 840 20 L 800 20" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.6"/>
  
</svg>
