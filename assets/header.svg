<svg width="100%" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap');
    
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 58px;
      font-weight: 900;
      fill: url(#textGrad);
      text-anchor: middle;
      filter: url(#glow);
      animation: pulse 3s infinite alternate;
    }
    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 600;
      fill: #E6FBFF;
      text-anchor: middle;
      letter-spacing: 4px;
    }
    @keyframes pulse {
      0% { filter: drop-shadow(0 0 8px rgba(0,247,255,0.6)); }
      100% { filter: drop-shadow(0 0 16px rgba(255,43,214,0.8)); }
    }
    .wave1 { animation: shift 12s linear infinite; }
    .wave2 { animation: shift 8s linear infinite reverse; }
    @keyframes shift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1000px); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#08040A" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Cyberpunk grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Wave paths -->
  <g class="wave1">
    <path d="M 0 160 Q 250 110 500 160 T 1000 160 T 1500 160 T 2000 160 L 2000 230 L 0 230 Z" fill="rgba(0,229,255,0.15)" />
  </g>
  <g class="wave2">
    <path d="M 0 190 Q 250 140 500 190 T 1000 190 T 1500 190 T 2000 190 L 2000 230 L 0 230 Z" fill="rgba(255,0,127,0.15)" />
  </g>

  <!-- Accent Lines -->
  <path d="M 0 20 L 20 0 L 150 0 L 160 10 L 200 10" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.6"/>
  <path d="M 1000 210 L 980 230 L 850 230 L 840 220 L 800 220" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.6"/>
  
  <!-- Cyber elements -->
  <rect x="50" y="40" width="4" height="4" fill="#00E5FF" />
  <rect x="60" y="40" width="4" height="4" fill="#00E5FF" />
  <rect x="50" y="50" width="4" height="4" fill="#FF007F" />
  
  <rect x="940" y="170" width="4" height="4" fill="#FF007F" />
  <rect x="930" y="170" width="4" height="4" fill="#FF007F" />
  <rect x="940" y="180" width="4" height="4" fill="#00E5FF" />

  <text x="50%" y="115" class="title">SAUMYA CHATURVEDI</text>
  <text x="50%" y="160" class="subtitle">AI &amp; ML STUDENT | CREATIVE TECHNOLOGIST | BUILDER</text>
</svg>
