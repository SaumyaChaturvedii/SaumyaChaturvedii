<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFF"/>
      <stop offset="0.5" stop-color="#EDF4FF"/>
      <stop offset="1" stop-color="#FFF4FD"/>
    </linearGradient>
    <linearGradient id="snake-light" x1="80" y1="210" x2="1200" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0097A7"/>
      <stop offset="0.5" stop-color="#0077FF"/>
      <stop offset="1" stop-color="#C218B9"/>
    </linearGradient>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9E3F3" stroke-width="1"/>
    </pattern>
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="260" rx="26" fill="url(#bg-light)"/>
  <rect x="18" y="18" width="1244" height="224" rx="18" stroke="#00A9C5" stroke-opacity="0.18" stroke-width="2"/>
  <rect width="1280" height="260" rx="26" fill="url(#grid-light)" opacity="0.9"/>

  <path d="M70 205C118 205 126 136 184 136C243 136 247 207 303 207C360 207 363 96 426 96C489 96 489 182 547 182C605 182 617 64 682 64C745 64 746 186 811 186C875 186 885 102 944 102C1005 102 1004 164 1063 164C1123 164 1140 72 1210 72" stroke="url(#snake-light)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-light)" stroke-dasharray="220 1480">
    <animate attributeName="stroke-dashoffset" values="0;-850" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="180 1520;280 1420;180 1520" dur="4.2s" repeatCount="indefinite"/>
  </path>

  <circle cx="1210" cy="72" r="7" fill="#C218B9" filter="url(#glow-light)">
    <animate attributeName="r" values="7;10;7" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.92">
    <text x="80" y="82" fill="#0B1220" font-family="Orbitron, Arial, sans-serif" font-size="24" font-weight="700">NEON CONTRIBUTION SNAKE</text>
    <text x="80" y="114" fill="#52627C" font-family="Rajdhani, Arial, sans-serif" font-size="18" font-weight="600">live activity trail syncing through the grid</text>
  </g>

  <g opacity="0.85">
    <rect x="1010" y="180" width="178" height="32" rx="16" fill="#FFFFFF" stroke="#C218B9" stroke-opacity="0.32"/>
    <text x="1034" y="201" fill="#0077FF" font-family="Rajdhani, Arial, sans-serif" font-size="16" font-weight="700">STATUS // ACTIVE</text>
  </g>
</svg>
